[graph]
all-features = false

[advisories]
version = 2
yanked = "deny"
ignore = [
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error is pulled in by Tauri's Linux GTK3 stack (glib-macros); revisit when Tauri moves off GTK3" },
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CDLA-Permissive-2.0", # webpki-roots, the certificate roots ureq trusts for provider calls
    "MPL-2.0", # cssparser, cssparser-macros, selectors, dtoa-short, option-ext (Tauri's HTML tooling and dirs)
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true # ontara-core is a path dependency inside this workspace
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
